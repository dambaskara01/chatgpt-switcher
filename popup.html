<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>ChatGPT Switcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon32.png" alt="Logo" class="logo">
      <h1>ChatGPT Switcher</h1>
    </div>
    <span id="badge" class="badge">
      <span class="badge-dot"></span>
      <span class="badge-text">memuat…</span>
    </span>
  </header>

  <div id="list" class="list"></div>

  <div id="empty" class="empty" hidden>
    <div class="empty-icon-wrap">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/>
        <line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
    </div>
    <div class="empty-title">Belum Ada Akun Tersimpan</div>
    <div class="empty-desc">Login ke akun Anda di chatgpt.com, sesi akan langsung otomatis dicatat di sini.</div>
  </div>

  <div id="status" class="status"></div>

  <footer>
    <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <span>Sesi otomatis dicatat & disimpan lokal di browser.</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
